<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b0e"/>
      <stop offset="100%" stop-color="#4a2e18"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ba84"/>
      <stop offset="50%" stop-color="#c4955a"/>
      <stop offset="100%" stop-color="#9a6e37"/>
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a84328"/>
      <stop offset="100%" stop-color="#6e2513"/>
    </linearGradient>
    <pattern id="burlap" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="#3d2614" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  <rect width="400" height="300" fill="url(#burlap)" opacity="0.4"/>

  <!-- Burlap Sack Edge -->
  <path d="M -10 220 Q 200 180 410 220 L 410 310 L -10 310 Z" fill="#6d4c2b" stroke="#4a3119" stroke-width="3"/>

  <!-- Groundnut Pod 1 (Main Shell In Shell) -->
  <g transform="translate(180, 130) rotate(-15)">
    <!-- Pod Shadow -->
    <ellipse cx="2" cy="18" rx="75" ry="32" fill="#140a04" opacity="0.6"/>
    <!-- Main Shell Outer Contour -->
    <path d="M -65 -5 C -65 -35 -20 -35 0 -15 C 20 -35 65 -35 65 -5 C 65 25 20 25 0 10 C -20 25 -65 25 -65 -5 Z" fill="url(#shellGrad)" stroke="#744f24" stroke-width="3"/>
    <!-- Shell Ridges & Texture -->
    <path d="M -50 -10 C -30 -20 30 -20 50 -10 M -45 5 C -25 15 25 15 45 5 M -35 -2 C -15 -5 15 -5 35 -2" fill="none" stroke="#7a5528" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Shell Constriction Waist -->
    <path d="M 0 -22 C 2 -10 2 10 0 18" fill="none" stroke="#5d3c16" stroke-width="3"/>
  </g>

  <!-- Groundnut Pod 2 (Opened Shell showing Peanuts) -->
  <g transform="translate(270, 170) rotate(25)">
    <path d="M -50 -5 C -50 -30 -15 -30 0 -10 C 15 -30 50 -30 50 -5 C 50 20 15 20 0 8 C -15 20 -50 20 -50 -5 Z" fill="url(#shellGrad)" stroke="#69451d" stroke-width="2"/>
    <!-- Exposed Red Peanut Kernel 1 -->
    <ellipse cx="-22" cy="-2" rx="18" ry="14" fill="url(#kernelGrad)"/>
    <!-- Exposed Red Peanut Kernel 2 -->
    <ellipse cx="20" cy="-2" rx="18" ry="14" fill="url(#kernelGrad)"/>
  </g>

  <!-- Groundnut Pod 3 (Background Pod) -->
  <g transform="translate(90, 160) rotate(-35)">
    <path d="M -55 -5 C -55 -30 -15 -30 0 -10 C 15 -30 55 -30 55 -5 C 55 20 15 20 0 8 C -15 20 -55 20 -55 -5 Z" fill="url(#shellGrad)" opacity="0.9" stroke="#5d3c16" stroke-width="2"/>
  </g>

  <!-- Loose Red Peanut Kernels -->
  <g transform="translate(140, 210)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="url(#kernelGrad)" transform="rotate(10)"/>
    <ellipse cx="-5" cy="-2" rx="3" ry="5" fill="#d47055" opacity="0.6"/>
  </g>
  <g transform="translate(210, 220)">
    <ellipse cx="0" cy="0" rx="15" ry="11" fill="url(#kernelGrad)" transform="rotate(-20)"/>
    <ellipse cx="-4" cy="-3" rx="4" ry="6" fill="#d47055" opacity="0.6"/>
  </g>

  <!-- Quality Badge Overlay -->
  <rect x="15" y="15" width="170" height="34" rx="8" fill="rgba(18, 53, 36, 0.85)" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="25" y="37" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🥜 GROUNDNUT PODS</text>
</svg>
