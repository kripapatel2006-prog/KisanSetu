<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="riceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#1b0000"/>
    </linearGradient>
    <linearGradient id="goldGrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#riceBg)"/>

  <!-- Golden Paddy Rice Ear 1 -->
  <g transform="translate(160, 160) rotate(-20)">
    <path d="M 0 120 Q 20 40 80 -40" stroke="#f57f17" stroke-width="4" fill="none"/>
    <!-- Rice Grains along stalk -->
    <ellipse cx="10" cy="80" rx="10" ry="5" fill="url(#goldGrain)" transform="rotate(30, 10, 80)"/>
    <ellipse cx="22" cy="60" rx="11" ry="5" fill="url(#goldGrain)" transform="rotate(35, 22, 60)"/>
    <ellipse cx="35" cy="40" rx="12" ry="5.5" fill="url(#goldGrain)" transform="rotate(40, 35, 40)"/>
    <ellipse cx="50" cy="18" rx="12" ry="5.5" fill="url(#goldGrain)" transform="rotate(45, 50, 18)"/>
    <ellipse cx="65" cy="-5" rx="12" ry="5.5" fill="url(#goldGrain)" transform="rotate(50, 65, -5)"/>
    <ellipse cx="80" cy="-30" rx="10" ry="5" fill="url(#goldGrain)" transform="rotate(55, 80, -30)"/>
  </g>

  <!-- Golden Paddy Rice Ear 2 -->
  <g transform="translate(240, 180) rotate(15)">
    <path d="M 0 100 Q -20 30 -60 -50" stroke="#f57f17" stroke-width="4" fill="none"/>
    <ellipse cx="-10" cy="70" rx="10" ry="5" fill="url(#goldGrain)" transform="rotate(-30, -10, 70)"/>
    <ellipse cx="-22" cy="50" rx="11" ry="5" fill="url(#goldGrain)" transform="rotate(-35, -22, 50)"/>
    <ellipse cx="-35" cy="30" rx="12" ry="5.5" fill="url(#goldGrain)" transform="rotate(-40, -35, 30)"/>
    <ellipse cx="-50" cy="8" rx="12" ry="5.5" fill="url(#goldGrain)" transform="rotate(-45, -50, 8)"/>
  </g>

  <!-- Rice Bowl Grains -->
  <g transform="translate(200, 220)">
    <path d="M -80 0 Q 0 70 80 0 Z" fill="#d7ccc8" stroke="#a1887f" stroke-width="3"/>
    <!-- Stacked White Rice Grains -->
    <ellipse cx="-40" cy="-10" rx="8" ry="4" fill="#ffffff" transform="rotate(15, -40, -10)"/>
    <ellipse cx="-15" cy="-15" rx="9" ry="4" fill="#ffffff" transform="rotate(-10, -15, -15)"/>
    <ellipse cx="10" cy="-12" rx="9" ry="4" fill="#ffffff" transform="rotate(20, 10, -12)"/>
    <ellipse cx="35" cy="-8" rx="8" ry="4" fill="#ffffff" transform="rotate(-15, 35, -8)"/>
  </g>

  <rect x="15" y="15" width="180" height="34" rx="8" fill="rgba(62, 39, 35, 0.85)" stroke="#ffb300" stroke-width="1.5"/>
  <text x="25" y="37" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🌾 GOLDEN PADDY RICE</text>
</svg>
