<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b382b"/>
      <stop offset="100%" stop-color="#0f241a"/>
    </linearGradient>
    <radialGradient id="tomRed1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="40%" stop-color="#e61a1a"/>
      <stop offset="85%" stop-color="#990000"/>
      <stop offset="100%" stop-color="#660000"/>
    </radialGradient>
    <radialGradient id="tomRed2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6666"/>
      <stop offset="50%" stop-color="#cc1111"/>
      <stop offset="100%" stop-color="#770000"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#tomBg)"/>

  <!-- Main Tomato 1 -->
  <g transform="translate(190, 160)">
    <ellipse cx="0" cy="15" rx="85" ry="20" fill="#06120b" opacity="0.6"/>
    <circle cx="0" cy="0" r="75" fill="url(#tomRed1)"/>
    <!-- Highlight -->
    <ellipse cx="-25" cy="-25" rx="20" ry="12" fill="#ffffff" opacity="0.35" transform="rotate(-25, -25, -25)"/>
    <!-- Calyx Stem -->
    <path d="M 0 -75 L -12 -90 M 0 -75 L 12 -88 M 0 -75 L -25 -70 M 0 -75 L 25 -68 M 0 -75 L 0 -95" stroke="#2e7d32" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 -75 Q -15 -60 -30 -65 M 0 -75 Q 15 -60 30 -65" fill="none" stroke="#4caf50" stroke-width="5"/>
  </g>

  <!-- Tomato 2 (Background Left) -->
  <g transform="translate(90, 180)">
    <circle cx="0" cy="0" r="55" fill="url(#tomRed2)"/>
    <ellipse cx="-18" cy="-18" rx="14" ry="8" fill="#ffffff" opacity="0.3" transform="rotate(-25, -18, -18)"/>
    <path d="M 0 -55 L -10 -68 M 0 -55 L 10 -65 M 0 -55 L 0 -72" stroke="#2e7d32" stroke-width="5"/>
  </g>

  <!-- Tomato 3 (Background Right) -->
  <g transform="translate(300, 175)">
    <circle cx="0" cy="0" r="60" fill="url(#tomRed1)"/>
    <ellipse cx="-20" cy="-20" rx="15" ry="9" fill="#ffffff" opacity="0.3" transform="rotate(-25, -20, -20)"/>
    <path d="M 0 -60 L -12 -72 M 0 -60 L 12 -70 M 0 -60 L 0 -76" stroke="#2e7d32" stroke-width="5"/>
  </g>

  <rect x="15" y="15" width="180" height="34" rx="8" fill="rgba(18, 53, 36, 0.85)" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="25" y="37" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🍅 RIPE RED TOMATOES</text>
</svg>

