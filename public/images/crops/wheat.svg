<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="whtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3b12"/>
      <stop offset="100%" stop-color="#1f1804"/>
    </linearGradient>
    <linearGradient id="whtGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#whtBg)"/>

  <!-- Wheat Spike 1 (Center Erect Head) -->
  <g transform="translate(200, 140)">
    <!-- Central Stalk Stem -->
    <line x1="0" y1="120" x2="0" y2="-60" stroke="#f57f17" stroke-width="4"/>
    <!-- Distinct Wheat Spikelets with Awns (Beards) -->
    <g transform="translate(0, -40)">
      <ellipse cx="-12" cy="0" rx="14" ry="7" fill="url(#whtGold)" transform="rotate(-30, -12, 0)"/>
      <ellipse cx="12" cy="0" rx="14" ry="7" fill="url(#whtGold)" transform="rotate(30, 12, 0)"/>
      <!-- Long Awn Beards -->
      <line x1="-20" y1="-2" x2="-45" y2="-25" stroke="#ffe082" stroke-width="1.5"/>
      <line x1="20" y1="-2" x2="45" y2="-25" stroke="#ffe082" stroke-width="1.5"/>
    </g>
    <g transform="translate(0, -15)">
      <ellipse cx="-13" cy="0" rx="15" ry="7.5" fill="url(#whtGold)" transform="rotate(-30, -13, 0)"/>
      <ellipse cx="13" cy="0" rx="15" ry="7.5" fill="url(#whtGold)" transform="rotate(30, 13, 0)"/>
      <line x1="-20" y1="-2" x2="-48" y2="-25" stroke="#ffe082" stroke-width="1.5"/>
      <line x1="20" y1="-2" x2="48" y2="-25" stroke="#ffe082" stroke-width="1.5"/>
    </g>
    <g transform="translate(0, 10)">
      <ellipse cx="-14" cy="0" rx="15" ry="8" fill="url(#whtGold)" transform="rotate(-30, -14, 0)"/>
      <ellipse cx="14" cy="0" rx="15" ry="8" fill="url(#whtGold)" transform="rotate(30, 14, 0)"/>
    </g>
    <g transform="translate(0, 35)">
      <ellipse cx="-14" cy="0" rx="15" ry="8" fill="url(#whtGold)" transform="rotate(-30, -14, 0)"/>
      <ellipse cx="14" cy="0" rx="15" ry="8" fill="url(#whtGold)" transform="rotate(30, 14, 0)"/>
    </g>
  </g>

  <!-- Wheat Spike 2 (Left Leaning) -->
  <g transform="translate(120, 160) rotate(-22)">
    <line x1="0" y1="120" x2="0" y2="-50" stroke="#f57f17" stroke-width="4"/>
    <g transform="translate(0, -30)">
      <ellipse cx="-12" cy="0" rx="13" ry="7" fill="url(#whtGold)" transform="rotate(-30, -12, 0)"/>
      <ellipse cx="12" cy="0" rx="13" ry="7" fill="url(#whtGold)" transform="rotate(30, 12, 0)"/>
    </g>
    <g transform="translate(0, -5)">
      <ellipse cx="-13" cy="0" rx="14" ry="7" fill="url(#whtGold)" transform="rotate(-30, -13, 0)"/>
      <ellipse cx="13" cy="0" rx="14" ry="7" fill="url(#whtGold)" transform="rotate(30, 13, 0)"/>
    </g>
  </g>

  <!-- Wheat Spike 3 (Right Leaning) -->
  <g transform="translate(280, 165) rotate(20)">
    <line x1="0" y1="120" x2="0" y2="-50" stroke="#f57f17" stroke-width="4"/>
    <g transform="translate(0, -30)">
      <ellipse cx="-12" cy="0" rx="13" ry="7" fill="url(#whtGold)" transform="rotate(-30, -12, 0)"/>
      <ellipse cx="12" cy="0" rx="13" ry="7" fill="url(#whtGold)" transform="rotate(30, 12, 0)"/>
    </g>
  </g>

  <rect x="15" y="15" width="180" height="34" rx="8" fill="rgba(74, 59, 18, 0.85)" stroke="#ffb300" stroke-width="1.5"/>
  <text x="25" y="37" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🌾 GOLDEN WHEAT EARS</text>
</svg>

